[project]
name = "recon"
version = "0.1.0"
description = "Multi-agent RAG system that turns competitor news into a weekly sales brief"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=4.1.3",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "langchain-anthropic>=1.7.6",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.7.0",
    "langgraph>=1.2.17",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
eval = [
    "ragas>=0.4.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
